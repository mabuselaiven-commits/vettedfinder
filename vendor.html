<section class="events">
  <h2 id="vendorTitle">Vendor</h2>

  <!-- ✅ PASTE FORM HERE -->
  <div class="request-form">
    <h3>Request This Service</h3>

    <input type="text" id="service" value="Catering" readonly>
<input type="text" id="vendorId" value="V#1" readonly>

    <input type="date" id="date">
    <input type="text" id="location" placeholder="Event Location">
    <input type="number" id="people" placeholder="Number of People">
    <textarea id="notes" placeholder="Extra details"></textarea>

    <button onclick="showLaunchMessage()" class="btn primary">
      Send Request on WhatsApp
    </button>
  </div>

</section>
<script>
function sendToWhatsApp() {
  let service = document.getElementById("service").value;
  let vendor = document.getElementById("vendorId").value;
  let date = document.getElementById("date").value;
  let location = document.getElementById("location").value;
  let people = document.getElementById("people").value;
  let notes = document.getElementById("notes").value;

  let phoneNumber = "27695394846"; // replace with your number

  let message = `Hi, I would like to request a service.

Service: ${service}
Vendor: ${vendor}
Date: ${date}
Location: ${location}
People: ${people}
Details: ${notes}`;

  let url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

  window.open(url, "_blank");
}
</script>

<script>
  const params = new URLSearchParams(window.location.search);

  const service = params.get("service");
  const id = params.get("id");

  if (service) {
    document.getElementById("service").value = service;
  }

  if (id) {
    document.getElementById("vendorId").value = id;
  }
</script>

<script>
function showLaunchMessage() {
  document.getElementById("launchPopup").style.display = "flex";

function closePopup() {

</script>

<div id="launchPopup" class="popup-overlay">
